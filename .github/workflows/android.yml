name: Android CI and APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Check, test, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Prepare build configuration
        env:
          # Pull requests build with placeholders, including PRs from this repository.
          GOOGLE_SERVICES_JSON: ${{ github.event_name != 'pull_request' && secrets.GOOGLE_SERVICES_JSON || '' }}
          PLANT_NET_API_KEY: ${{ github.event_name != 'pull_request' && secrets.PLANT_NET_API_KEY || '' }}
          PERENUAL_API_KEY: ${{ github.event_name != 'pull_request' && secrets.PERENUAL_API_KEY || '' }}
        run: python3 .github/scripts/prepare_android_ci.py

      - name: Check formatting, run tests and lint, build APK
        run: ./gradlew --no-daemon --stacktrace :app:spotlessCheck :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: planty-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
